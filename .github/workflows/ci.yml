name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -n 25 lint.log | while IFS= read -r line; do
              echo "::error::${line:0:250}"
            done
            exit "$code"
          fi

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: npm test