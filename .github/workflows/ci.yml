name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: |
          set +e
          npm test > test-out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            MSG=$(grep -a -A 40 -m 1 -E "Failed Tests|Failed Suites|Unhandled|Test process crashed|Vitest caught" test-out.txt | head -c 3200 | sed -z 's/\n/%0A/g' || true)
            if [ -z "$MSG" ]; then MSG=$(tail -c 3200 test-out.txt | sed -z 's/\n/%0A/g'); fi
            echo "::error::${MSG:0:4000}"
          fi
          exit $code
