name: Regenerate lockfile

on:
  push:
    branches:
      - vibe/remove-unused-deps-72
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: regen-lock
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    if: github.head_ref == '' || github.head_ref == 'vibe/remove-unused-deps-72'
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Remove unused UI components
        run: |
          git rm --ignore-unmatch src/components/ui/accordion.tsx \
            src/components/ui/alert-dialog.tsx \
            src/components/ui/aspect-ratio.tsx \
            src/components/ui/avatar.tsx \
            src/components/ui/breadcrumb.tsx \
            src/components/ui/calendar.tsx \
            src/components/ui/carousel.tsx \
            src/components/ui/chart.tsx \
            src/components/ui/collapsible.tsx \
            src/components/ui/command.tsx \
            src/components/ui/context-menu.tsx \
            src/components/ui/drawer.tsx \
            src/components/ui/dropdown-menu.tsx \
            src/components/ui/form.tsx \
            src/components/ui/hover-card.tsx \
            src/components/ui/input-otp.tsx \
            src/components/ui/menubar.tsx \
            src/components/ui/navigation-menu.tsx \
            src/components/ui/pagination.tsx \
            src/components/ui/popover.tsx \
            src/components/ui/progress.tsx \
            src/components/ui/radio-group.tsx \
            src/components/ui/resizable.tsx \
            src/components/ui/sidebar.tsx \
            src/components/ui/slider.tsx \
            src/components/ui/switch.tsx \
            src/components/ui/table.tsx \
            src/components/ui/textarea.tsx \
            src/components/ui/toggle-group.tsx

      - name: Regenerate package-lock.json
        run: npm install --legacy-peer-deps

      - Name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: remove unused UI components and regenerate lockfile (#72)"
            git push
          fi

      - name: Verify clean install without legacy-peer-deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: npm test
