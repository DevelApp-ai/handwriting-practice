name: Typecheck report

on:
  push:
    branches:
      - vibe/fix-ci-main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: typecheck-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.head_ref == '' || github.head_ref == 'vibe/fix-ci-main'
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and sync lockfile
        run: |
          set +e
          npm install > npm-install-report.txt 2>&1
          echo "exit: $?" >> npm-install-report.txt
          npm ls react typescript @radix-ui/react-slot @phosphor-icons/react >> npm-install-report.txt 2>&1
          exit 0

      - name: Commit updated lockfile
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "chore: regenerate package-lock.json [skip ci]" && git push)

      - name: Collect reports
        if: always()
        run: |
          set +e
          npx tsc -b > tsc-report.txt 2>&1
          echo "exit: $?" >> tsc-report.txt
          npx eslint . > eslint-report.txt 2>&1
          echo "exit: $?" >> eslint-report.txt
          npx vitest run > test-report.txt 2>&1
          echo "exit: $?" >> test-report.txt
          { echo '--- failures ---'; grep -n -B 2 -A 12 -E "(FAIL|× )" test-report.txt | head -300; echo '--- summary ---'; tail -40 test-report.txt; } > test-summary.txt
          exit 0

      - name: Commit reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npm-install-report.txt tsc-report.txt eslint-report.txt test-report.txt test-summary.txt
          git diff --cached --quiet || (git commit -m "chore: update typecheck/lint reports [skip ci]" && git push)
